<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" fill="none">
<title>The borrowed world — an original architectural engraving</title>
<desc>A floating antique key within a Gothic stone arch, surrounded by ivy, celestial marks, and fine engraved lines. An artistic metaphor for access and sharing.</desc>
